
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#101522">
  <title>리스크 게임</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      color-scheme: dark;
      --bg: #101522;
      --panel: #1b2334;
      --panel-light: #263149;
      --text: #f5f7ff;
      --muted: #aab4c9;
      --blue: #2479ed;
      --red: #e84149;
      --green: #42d392;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      cursor: not-allowed;
    }

    .screen {
      display: none;
      min-height: 100dvh;
      padding: 20px 16px;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    .top-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .info-box {
      min-width: 0;
      padding: 13px 10px;
      border: 1px solid #344059;
      border-radius: 14px;
      background: var(--panel);
      text-align: center;
    }

    .info-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .info-value {
      display: block;
      font-size: clamp(16px, 4.5vw, 22px);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .app-title {
      margin: 0 0 12px;
      text-align: center;
      font-size: 30px;
      font-weight: 900;
    }

    .subtitle {
      margin: 0 0 30px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .menu-button {
      min-height: 105px;
      border: 1px solid #394761;
      border-radius: 19px;
      background: var(--panel);
      color: var(--text);
      font-size: 21px;
      font-weight: 800;
      transition: transform 0.12s, background 0.12s;
    }

    .menu-button:active {
      transform: scale(0.97);
      background: var(--panel-light);
    }

    .game-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      gap: 24px;
    }

    .turn-label {
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .choice {
      position: relative;
      min-width: 0;
      min-height: 265px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px 10px;
      border: 2px solid transparent;
      border-radius: 22px;
      color: #fff;
      overflow: hidden;
      user-select: none;
      transition: transform 0.12s, filter 0.12s;
    }

    .choice.blue {
      background: linear-gradient(155deg, #318cff, #1454c5);
      border-color: #5da5ff;
    }

    .choice.red {
      background: linear-gradient(155deg, #ff5b62, #bc202e);
      border-color: #ff8589;
    }

    .choice:not(:disabled):active {
      transform: scale(0.97);
    }

    .choice:disabled {
      cursor: not-allowed;
    }

    .choice-color-name {
      font-size: 19px;
      font-weight: 800;
    }

    .choice-effect {
      font-size: clamp(22px, 6vw, 34px);
      font-weight: 950;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .choice-description {
      min-height: 42px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      overflow-wrap: anywhere;
    }

    /* 강제 선택: 기존 선택지를 유지하고 X만 겹쳐 표시 */
    .choice.blocked {
      cursor: not-allowed;
    }

    .choice.blocked .choice-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 12, 22, 0.52);
      pointer-events: none;
    }

    .choice-overlay-x {
      font-size: clamp(100px, 24vw, 150px);
      line-height: 1;
      font-weight: 300;
      color: white;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    }

    .game-bottom {
      display: flex;
      justify-content: flex-end;
    }

    .stop-button, .secondary-button, .primary-button {
      min-height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      font-weight: 800;
    }

    .stop-button {
      background: #3a4357;
      color: white;
    }

    .primary-button {
      background: #4389ff;
      color: white;
    }

    .secondary-button {
      background: #30394d;
      color: white;
    }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.72);
    }

    .dialog-backdrop.open {
      display: flex;
    }

    .dialog {
      width: 100%;
      max-width: 390px;
      max-height: 90dvh;
      overflow-y: auto;
      padding: 23px 19px;
      border: 1px solid #3a4760;
      border-radius: 22px;
      background: #1b2334;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.35);
    }

    .dialog h2 {
      margin: 0 0 10px;
      font-size: 23px;
      text-align: center;
    }

    .dialog-description {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .amount-input {
      display: block;
      width: 100%;
      min-height: 55px;
      margin: 10px 0;
      padding: 12px;
      border: 1px solid #475570;
      border-radius: 12px;
      outline: none;
      background: #111827;
      color: white;
      font-size: 23px;
      font-weight: 800;
      text-align: center;
    }

    .amount-input:focus {
      border-color: #4389ff;
    }

    .message {
      min-height: 24px;
      margin: 10px 0;
      color: #ff8589;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .dialog-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .dialog-actions.single {
      grid-template-columns: 1fr;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid #354056;
    }

    .summary-label {
      color: var(--muted);
      font-size: 14px;
    }

    .summary-value {
      font-size: 18px;
      font-weight: 850;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .summary-total {
      margin-top: 8px;
      padding-top: 20px;
      border-bottom: 0;
    }

    .summary-total .summary-label {
      color: white;
      font-size: 17px;
      font-weight: 800;
    }

    .summary-total .summary-value {
      font-size: 27px;
    }

    .positive {
      color: var(--green);
    }

    .negative {
      color: #ff777e;
    }

    .notice {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 360px) {
      .screen {
        padding: 14px 11px;
      }

      .choice {
        min-height: 235px;
        padding: 14px 7px;
      }

      .choice-description {
        font-size: 12px;
      }
    }

    @media (min-width: 700px) {
      .screen {
        padding: 26px;
      }

      .choice {
        min-height: 320px;
      }
    }
  </style>
</head>

<body>
  <!-- 메인 화면 -->
  <section id="mainScreen" class="screen active">
    <div class="top-info">
      <div class="info-box">
        <span class="info-label">리롤</span>
        <strong id="mainRerolls" class="info-value">0개</strong>
      </div>
      <div class="info-box">
        <span class="info-label">예산</span>
        <strong id="budgetDisplay" class="info-value">10,000원</strong>
      </div>
    </div>

    <main class="main-content">
      <h1 class="app-title">리스크 게임</h1>
      <p class="subtitle">선택의 결과를 감당할 수 있겠어?</p>

      <div class="menu-grid">
        <button class="menu-button" data-menu="shop">상점</button>
        <button class="menu-button" id="gameMenuButton">게임</button>
        <button class="menu-button" data-menu="settings">설정</button>
        <button class="menu-button" data-menu="money">돈</button>
      </div>
    </main>
  </section>

  <!-- 게임 화면 -->
  <section id="gameScreen" class="screen">
    <div class="top-info">
      <div class="info-box">
        <span class="info-label">리롤</span>
        <strong id="gameRerolls" class="info-value">0개</strong>
      </div>
      <div class="info-box">
        <span class="info-label">현재 게임 금액</span>
        <strong id="gameMoneyDisplay" class="info-value">0원</strong>
      </div>
    </div>

    <main class="game-layout">
      <div id="turnDisplay" class="turn-label">1번째 선택</div>

      <div class="choices">
        <button id="blueButton" class="choice blue">
          <span class="choice-color-name">파랑</span>
          <span id="blueEffect" class="choice-effect">+50%</span>
          <span id="blueDescription" class="choice-description">
            현재 금액의 50% 추가
          </span>
          <span class="choice-overlay" hidden>
            <span class="choice-overlay-x">×</span>
          </span>
        </button>

        <button id="redButton" class="choice red">
          <span class="choice-color-name">빨강</span>
          <span id="redEffect" class="choice-effect">+100%</span>
          <span id="redDescription" class="choice-description">
            다음 턴 빨강 강제 선택
          </span>
          <span class="choice-overlay" hidden>
            <span class="choice-overlay-x">×</span>
          </span>
        </button>
      </div>

      <div class="game-bottom">
        <button id="stopButton" class="stop-button">중지</button>
      </div>
    </main>
  </section>

  <!-- 게임 금액 입력 창 -->
  <div id="amountDialog" class="dialog-backdrop">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="amountTitle">
      <h2 id="amountTitle">게임 금액</h2>
      <p class="dialog-description">
        게임에 사용할 금액을 입력해.<br>
        최소 1,000원 · 최대 5,000원<br>
        1,000원 단위로 입력해야 해.
      </p>

      <input
        id="amountInput"
        class="amount-input"
        type="number"
        inputmode="numeric"
        min="1000"
        max="5000"
        step="1000"
        placeholder="예: 3000"
        autocomplete="off"
      >

      <div id="amountMessage" class="message" aria-live="polite"></div>

      <div class="dialog-actions">
        <button id="cancelAmountButton" class="secondary-button">취소</button>
        <button id="startGameButton" class="primary-button">시작</button>
      </div>
    </div>
  </div>

  <!-- 게임 결과 창 -->
  <div id="summaryDialog" class="dialog-backdrop">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="summaryTitle">
      <h2 id="summaryTitle">게임 결과</h2>
      <p id="summaryReason" class="dialog-description">게임이 종료됐어.</p>

      <div class="summary-row">
        <span class="summary-label">게임금액</span>
        <strong id="summaryStart" class="summary-value">0원</strong>
      </div>

      <div class="summary-row">
        <span class="summary-label">이익/손해</span>
        <strong id="summaryChange" class="summary-value">0원</strong>
      </div>

      <div class="summary-row summary-total">
        <span class="summary-label">총액</span>
        <strong id="summaryTotal" class="summary-value">0원</strong>
      </div>

      <p class="notice">
        확인을 누르면 최종 금액이 메인 화면 예산에 반영돼.
      </p>

      <div class="dialog-actions single">
        <button id="confirmSummaryButton" class="primary-button">확인</button>
      </div>
    </div>
  </div>

  <!-- 아직 세부 규칙이 정해지지 않은 메뉴 -->
  <div id="placeholderDialog" class="dialog-backdrop">
    <div class="dialog" role="dialog" aria-modal="true">
      <h2 id="placeholderTitle">메뉴</h2>
      <p id="placeholderDescription" class="dialog-description">
        이 기능은 아직 준비 중이야.
      </p>
      <div class="dialog-actions single">
        <button id="closePlaceholderButton" class="primary-button">확인</button>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    // =========================
    // 게임 데이터
    // =========================

    const state = {
      budget: 10000,
      mainRerolls: 0,

      startingMoney: 0,
      gameMoney: 0,
      gameRerolls: 0,
      turn: 1,

      // null, "blue", "red"
      forcedColor: null,

      // 종료한 게임의 결과를 확인하기 전까지 보관
      pendingFinalMoney: null,
      gameActive: false,

      choices: {
        blue: null,
        red: null
      }
    };

    const $ = (id) => document.getElementById(id);

    const screens = {
      main: $("mainScreen"),
      game: $("gameScreen")
    };

    const amountDialog = $("amountDialog");
    const summaryDialog = $("summaryDialog");
    const placeholderDialog = $("placeholderDialog");

    const numberFormat = new Intl.NumberFormat("ko-KR");

    function won(amount) {
      return numberFormat.format(amount) + "원";
    }

    function signedWon(amount) {
      if (amount > 0) return "+" + won(amount);
      if (amount < 0) return "-" + won(Math.abs(amount));
      return "0원";
    }

    function showScreen(name) {
      Object.values(screens).forEach((screen) => {
        screen.classList.remove("active");
      });

      screens[name].classList.add("active");
    }

    function updateMainDisplay() {
      $("mainRerolls").textContent = state.mainRerolls + "개";
      $("budgetDisplay").textContent = won(state.budget);
    }

    function updateGameDisplay() {
      $("gameRerolls").textContent = state.gameRerolls + "개";
      $("gameMoneyDisplay").textContent = won(state.gameMoney);
      $("turnDisplay").textContent = state.turn + "번째 선택";
    }

    function openAmountDialog() {
      $("amountInput").value = "";
      $("amountMessage").textContent = "";
      amountDialog.classList.add("open");

      setTimeout(() => $("amountInput").focus(), 50);
    }

    function closeAmountDialog() {
      amountDialog.classList.remove("open");
    }

    // =========================
    // 게임 시작
    // =========================

    function startGame() {
      const rawValue = $("amountInput").value.trim();
      const amount = Number(rawValue);

      if (
        rawValue === "" ||
        !Number.isFinite(amount) ||
        !Number.isInteger(amount) ||
        amount < 1000 ||
        amount > 5000 ||
        amount % 1000 !== 0
      ) {
        $("amountMessage").textContent =
          "1,000원부터 5,000원까지 1,000원 단위로 입력해.";
        return;
      }

      if (amount > state.budget) {
        $("amountMessage").textContent =
          "예산이 부족해. 현재 예산은 " + won(state.budget) + "이야.";
        return;
      }

      // 예산에서 시작 금액을 미리 차감한다.
      // 결과 확인 시 최종 게임 금액을 다시 예산에 더한다.
      state.budget -= amount;

      state.startingMoney = amount;
      state.gameMoney = amount;
      state.gameRerolls = 0;
      state.turn = 1;
      state.forcedColor = null;
      state.pendingFinalMoney = null;
      state.gameActive = true;

      closeAmountDialog();
      updateMainDisplay();
      updateGameDisplay();
      showScreen("game");

      generateChoices();
    }

    // =========================
    // 랜덤 선택지
    // =========================

    /*
      각 선택지는 고유 ID를 가진다.
      파랑과 빨강은 ID가 중복되지 않게 생성한다.

      gain: 현재 금액 증가
      loss: 현재 금액 감소
      rerollGain: 리롤 증가
      gainWithForcedColor: 금액 증가 후 다음 턴 특정 색 강제
      gainWithRerollCost: 금액 증가 후 리롤 차감
    */

    const choicePool = [
      {
        id: "gain30",
        type: "gain",
        amount: 30,
        effect: "+30%",
        description: "현재 금액의 30% 추가"
      },
      {
        id: "gain50",
        type: "gain",
        amount: 50,
        effect: "+50%",
        description: "현재 금액의 50% 추가"
      },
      {
        id: "gain75",
        type: "gain",
        amount: 75,
        effect: "+75%",
        description: "현재 금액의 75% 추가"
      },
      {
        id: "gain100",
        type: "gain",
        amount: 100,
        effect: "+100%",
        description: "현재 금액의 100% 추가"
      },
      {
        id: "loss25",
        type: "loss",
        amount: 25,
        effect: "-25%",
        description: "현재 금액의 25% 감소"
      },
      {
        id: "loss50",
        type: "loss",
        amount: 50,
        effect: "-50%",
        description: "현재 금액의 50% 감소"
      },
      {
        id: "rerollGain",
        type: "rerollGain",
        amount: 3,
        effect: "리롤 +3",
        description: "리롤 3개 획득"
      },
      {
        id: "gain100ForceRed",
        type: "gainWithForcedColor",
        amount: 100,
        color: "red",
        effect: "+100%",
        description: "다음 턴 빨강 강제 선택"
      },
      {
        id: "gain100ForceBlue",
        type: "gainWithForcedColor",
        amount: 100,
        color: "blue",
        effect: "+100%",
        description: "다음 턴 파랑 강제 선택"
      },
      {
        id: "gain200RerollCost",
        type: "gainWithRerollCost",
        amount: 200,
        rerollCost: 3,
        effect: "+200%",
        description: "리롤 3개 차감"
      },
      {
        id: "gain150ForceRed",
        type: "gainWithForcedColor",
        amount: 150,
        color: "red",
        effect: "+150%",
        description: "다음 턴 빨강 강제 선택"
      },
      {
        id: "gain150ForceBlue",
        type: "gainWithForcedColor",
        amount: 150,
        color: "blue",
        effect: "+150%",
        description: "다음 턴 파랑 강제 선택"
      }
    ];

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function availableChoices() {
      return choicePool.filter((choice) => {
        if (
          choice.type === "gainWithRerollCost" &&
          state.gameRerolls < choice.rerollCost
        ) {
          return false;
        }

        return true;
      });
    }

    function generateChoices() {
      if (!state.gameActive || state.gameMoney <= 0) return;

      const pool = availableChoices();

      if (pool.length < 2) {
        endGame("선택지가 부족해 게임이 종료됐어.");
        return;
      }

      const blue = randomItem(pool);

      const redPool = pool.filter((choice) => choice.id !== blue.id);
      const red = randomItem(redPool);

      state.choices.blue = blue;
      state.choices.red = red;

      renderChoice("blue", blue);
      renderChoice("red", red);

      updateForcedSelection();
      updateGameDisplay();
    }

    function renderChoice(color, choice) {
      $(color + "Effect").textContent = choice.effect;
      $(color + "Description").textContent = choice.description;
    }

    // =========================
    // 강제 선택 표시
    // =========================

    function updateForcedSelection() {
      ["blue", "red"].forEach((color) => {
        const button = $(color + "Button");
        const overlay = button.querySelector(".choice-overlay");
        const blocked =
          state.forcedColor !== null &&
          state.forcedColor !== color;

        button.disabled = blocked;
        button.classList.toggle("blocked", blocked);
        overlay.hidden = !blocked;
      });
    }

    // =========================
    // 선택지 실행
    // =========================

    function applyPercentChange(percent, isLoss) {
      if (isLoss && state.gameMoney <= 1000) {
        // 잔액이 1,000원 이하라면 감소 패널티로 즉시 0원
        state.gameMoney = 0;
        return;
      }

      const difference = Math.round(
        state.gameMoney * percent / 100
      );

      if (isLoss) {
        state.gameMoney = Math.max(
          0,
          state.gameMoney - difference
        );
      } else {
        state.gameMoney += difference;
      }
    }

    function chooseColor(color) {
      if (!state.gameActive) return;

      // 강제 선택된 반대 색상은 버튼 자체가 비활성화되어 있다.
      // 이 검사는 추가적인 안전장치다.
      if (
        state.forcedColor !== null &&
        state.forcedColor !== color
      ) {
        return;
      }

      const choice = state.choices[color];
      if (!choice) return;

      // 이번 턴의 강제 조건은 이번 선택으로 소모된다.
      state.forcedColor = null;

      switch (choice.type) {
        case "gain":
          applyPercentChange(choice.amount, false);
          break;

        case "loss":
          applyPercentChange(choice.amount, true);
          break;

        case "rerollGain":
          state.gameRerolls += choice.amount;
          break;

        case "gainWithForcedColor":
          applyPercentChange(choice.amount, false);

          if (state.gameMoney > 0) {
            state.forcedColor = choice.color;
          }
          break;

        case "gainWithRerollCost":
          // 생성 단계에서 리롤 보유량을 검사하지만,
          // 실행 직전에도 다시 검사한다.
          if (state.gameRerolls < choice.rerollCost) {
            generateChoices();
            return;
          }

          applyPercentChange(choice.amount, false);
          state.gameRerolls -= choice.rerollCost;
          break;

        default:
          return;
      }

      if (state.gameMoney <= 0) {
        state.gameMoney = 0;
        updateGameDisplay();
        endGame("현재 게임 금액이 0원이 되어 게임이 종료됐어.");
        return;
      }

      state.turn += 1;
      updateGameDisplay();
      generateChoices();
    }

    $("blueButton").addEventListener("click", () => {
      chooseColor("blue");
    });

    $("redButton").addEventListener("click", () => {
      chooseColor("red");
    });

    // =========================
    // 게임 종료 및 합계
    // =========================

    function endGame(reason) {
      if (!state.gameActive) return;

      state.gameActive = false;
      state.pendingFinalMoney = state.gameMoney;

      const start = state.startingMoney;
      const finalMoney = state.pendingFinalMoney;
      const change = finalMoney - start;

      $("summaryReason").textContent = reason;
      $("summaryStart").textContent = won(start);

      const changeElement = $("summaryChange");
      changeElement.textContent = signedWon(change);
      changeElement.classList.toggle("positive", change > 0);
      changeElement.classList.toggle("negative", change < 0);

      $("summaryTotal").textContent = won(finalMoney);

      summaryDialog.classList.add("open");
    }

    $("stopButton").addEventListener("click", () => {
      endGame("중지 버튼을 눌러 게임을 종료했어.");
    });

    $("confirmSummaryButton").addEventListener("click", () => {
      if (state.pendingFinalMoney === null) return;

      // 시작할 때 차감한 게임 시작금에
      // 게임 종료 시 남은 금액을 더한다.
      state.budget += state.pendingFinalMoney;

      state.pendingFinalMoney = null;
      state.forcedColor = null;
      state.choices.blue = null;
      state.choices.red = null;

      summaryDialog.classList.remove("open");

      updateMainDisplay();
      showScreen("main");
    });

    // =========================
    // 메인 메뉴
    // =========================

    $("gameMenuButton").addEventListener("click", () => {
      openAmountDialog();
    });

    $("startGameButton").addEventListener("click", startGame);

    $("cancelAmountButton").addEventListener("click", () => {
      closeAmountDialog();
    });

    $("amountInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") startGame();
    });

    $("amountInput").addEventListener("input", () => {
      $("amountMessage").textContent = "";
    });

    const placeholderMenus = {
      shop: {
        title: "상점",
        description: "상점 기능은 아직 설계되지 않았어."
      },
      settings: {
        title: "설정",
        description: "설정 기능은 아직 설계되지 않았어."
      },
      money: {
        title: "돈",
        description: "돈 메뉴의 기능은 아직 설계되지 않았어."
      }
    };

    document.querySelectorAll("[data-menu]").forEach((button) => {
      button.addEventListener("click", () => {
        const item = placeholderMenus[button.dataset.menu];

        $("placeholderTitle").textContent = item.title;
        $("placeholderDescription").textContent = item.description;

        placeholderDialog.classList.add("open");
      });
    });

    $("closePlaceholderButton").addEventListener("click", () => {
      placeholderDialog.classList.remove("open");
    });

    // 초기 표시
    updateMainDisplay();
    updateGameDisplay();
  </script>
</body>
</html>
