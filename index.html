
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <meta name="theme-color" content="#f4f6fb">
  <title>게임 앱</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --blue: #2878f0;
      --blue-dark: #165bc4;
      --red: #e53935;
      --red-dark: #bd2926;
      --background: #f4f6fb;
      --text: #202738;
      --muted: #778195;
      --card: #ffffff;
      --border: #e0e5ee;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Noto Sans KR",
        sans-serif;
      background: var(--background);
      color: var(--text);
      overscroll-behavior: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #91baff;
      outline-offset: 3px;
    }

    .screen {
      display: none;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 22px 20px;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    /* 공통 상단 정보 */

    .top-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .info-card {
      min-width: 0;
      padding: 14px 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .info-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 17px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* 메인 화면 */

    #mainScreen {
      justify-content: flex-start;
    }

    .app-heading {
      text-align: center;
      margin: 35px 0 10px;
    }

    .app-heading h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .app-heading p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .main-menu {
      width: 100%;
      max-width: 460px;
      margin: auto;
      padding: 25px 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .menu-button {
      aspect-ratio: 1.08;
      min-width: 0;
      border: 0;
      border-radius: 23px;
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 7px 15px rgba(24, 36, 65, 0.10);
      transition: transform 0.12s, filter 0.12s;
    }

    .menu-button:active {
      transform: scale(0.96);
      filter: brightness(0.92);
    }

    .menu-button .menu-icon {
      display: block;
      margin-bottom: 12px;
      font-size: 38px;
      line-height: 1;
    }

    .menu-shop {
      background: #3478f6;
    }

    .menu-game {
      background: #e64a45;
    }

    .menu-settings {
      background: #64748b;
    }

    .menu-money {
      background: #159b82;
    }

    .main-footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 0 0 10px;
    }

    /* 게임 화면 */

    #gameScreen {
      position: relative;
      padding-bottom: 75px;
    }

    .game-heading {
      margin: 20px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .game-button-area {
      width: 100%;
      max-width: 520px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
      align-items: center;
    }

    .game-button {
      width: 100%;
      aspect-ratio: 0.88;
      min-width: 0;
      border: 0;
      border-radius: 25px;
      color: #fff;
      font-size: clamp(20px, 5vw, 27px);
      font-weight: 850;
      box-shadow: 0 9px 22px rgba(20, 35, 65, 0.15);
      transition: transform 0.12s, filter 0.12s;
    }

    .game-button:active {
      transform: scale(0.96);
      filter: brightness(0.92);
    }

    .blue-button {
      background: var(--blue);
    }

    .red-button {
      background: var(--red);
    }

    .stop-button {
      position: absolute;
      right: 20px;
      bottom: 20px;
      min-width: 68px;
      padding: 10px 17px;
      border: 0;
      border-radius: 10px;
      background: #687386;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .stop-button:active {
      background: #4d5665;
    }

    /* 금액 입력 창 */

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 20px;
      background: rgba(14, 22, 38, 0.52);
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 390px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 25px 21px 21px;
      background: #fff;
      border-radius: 23px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.18);
      animation: modalIn 0.16s ease-out;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal h2 {
      margin: 0;
      text-align: center;
      font-size: 23px;
      letter-spacing: -0.5px;
    }

    .modal-description {
      margin: 10px 0 23px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
    }

    .amount-label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 750;
    }

    .amount-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 15px;
      border: 1px solid #ccd5e3;
      border-radius: 13px;
      background: #fff;
    }

    .amount-input-wrap:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(40, 120, 240, 0.12);
    }

    #amountInput {
      width: 100%;
      min-width: 0;
      height: 56px;
      padding: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 22px;
      font-weight: 800;
    }

    #amountInput:focus-visible {
      outline: none;
    }

    .won-label {
      color: #566176;
      font-size: 18px;
      font-weight: 700;
    }

    .amount-rules {
      margin-top: 14px;
      padding: 13px;
      border-radius: 12px;
      background: #f3f6fb;
      color: #566176;
      font-size: 13px;
      line-height: 1.9;
    }

    .amount-rules strong {
      color: #27364e;
    }

    .validation-message {
      min-height: 20px;
      margin: 11px 0 0;
      font-size: 12px;
      line-height: 1.6;
      color: #d22f2f;
    }

    .validation-message.success {
      color: #16834a;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 17px;
    }

    .action-button {
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
    }

    .start-button {
      background: var(--blue);
    }

    .start-button:active {
      background: var(--blue-dark);
    }

    .cancel-button {
      background: #7a8495;
    }

    .cancel-button:active {
      background: #606a7a;
    }

    /* 안내 창 */

    .notice-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      padding: 20px;
      background: rgba(14, 22, 38, 0.48);
      align-items: center;
      justify-content: center;
    }

    .notice-overlay.open {
      display: flex;
    }

    .notice-box {
      width: 100%;
      max-width: 320px;
      padding: 24px;
      border-radius: 19px;
      background: #fff;
      text-align: center;
    }

    .notice-box p {
      margin: 0 0 20px;
      font-size: 15px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .notice-box button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 11px;
      background: var(--blue);
      color: #fff;
      font-weight: 800;
    }

    @media (max-width: 360px) {
      .screen {
        padding-left: 14px;
        padding-right: 14px;
      }

      .info-card {
        font-size: 13px;
      }

      .info-value {
        font-size: 15px;
      }

      .main-menu {
        gap: 11px;
      }

      .menu-button {
        border-radius: 18px;
        font-size: 19px;
      }

      .game-button-area {
        gap: 10px;
      }

      .game-button {
        border-radius: 19px;
      }
    }

    @media (min-width: 700px) {
      .screen {
        max-width: 650px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       메인 화면
  ========================== -->
  <main id="mainScreen" class="screen active">

    <div class="top-info">
      <div class="info-card">
        <div class="info-label">리롤 횟수</div>
        <div class="info-value">리롤: ?개</div>
      </div>

      <div class="info-card">
        <div class="info-label">예산</div>
        <div class="info-value">예산: ????원</div>
      </div>
    </div>

    <header class="app-heading">
      <h1>메인 화면</h1>
      <p>원하는 메뉴를 선택하세요.</p>
    </header>

    <section class="main-menu">

      <button
        type="button"
        class="menu-button menu-shop"
        id="shopButton"
      >
        <span class="menu-icon" aria-hidden="true">🏪</span>
        상점
      </button>

      <button
        type="button"
        class="menu-button menu-game"
        id="openGameButton"
      >
        <span class="menu-icon" aria-hidden="true">🎮</span>
        게임
      </button>

      <button
        type="button"
        class="menu-button menu-settings"
        id="settingsButton"
      >
        <span class="menu-icon" aria-hidden="true">⚙️</span>
        설정
      </button>

      <button
        type="button"
        class="menu-button menu-money"
        id="moneyButton"
      >
        <span class="menu-icon" aria-hidden="true">💰</span>
        돈
      </button>

    </section>

    <footer class="main-footer">
      게임 앱
    </footer>

  </main>


  <!-- =========================
       게임 화면
  ========================== -->
  <section id="gameScreen" class="screen">

    <div class="top-info">

      <div class="info-card">
        <div class="info-label">리롤 횟수</div>
        <div class="info-value" id="gameRerollCount">
          리롤: 0개
        </div>
      </div>

      <div class="info-card">
        <div class="info-label">현재 소지금</div>
        <div class="info-value" id="gameMoney">
          0원
        </div>
      </div>

    </div>

    <div class="game-heading">
      게임 화면
    </div>

    <div class="game-button-area">

      <button
        type="button"
        class="game-button blue-button"
        id="blueButton"
      >
        파란 버튼
      </button>

      <button
        type="button"
        class="game-button red-button"
        id="redButton"
      >
        빨간 버튼
      </button>

    </div>

    <button
      type="button"
      class="stop-button"
      id="stopButton"
    >
      중지
    </button>

  </section>


  <!-- =========================
       게임 금액 입력 창
  ========================== -->
  <div
    class="modal-overlay"
    id="amountModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="amountTitle"
    aria-hidden="true"
  >

    <div class="modal">

      <h2 id="amountTitle">게임 금액 입력</h2>

      <p class="modal-description">
        게임에 사용할 금액을 입력하세요.
      </p>

      <form id="amountForm" novalidate>

        <label
          class="amount-label"
          for="amountInput"
        >
          게임 금액
        </label>

        <div class="amount-input-wrap">
          <input
            type="number"
            id="amountInput"
            name="amount"
            inputmode="numeric"
            min="1000"
            max="5000"
            step="1000"
            placeholder="금액 입력"
            autocomplete="off"
            required
          >

          <span class="won-label">원</span>
        </div>

        <div class="amount-rules">
          <div>최소 금액: <strong>1,000원</strong></div>
          <div>최대 금액: <strong>5,000원</strong></div>
          <div>입력 단위: <strong>1,000원</strong></div>
        </div>

        <p
          class="validation-message"
          id="validationMessage"
          aria-live="polite"
        ></p>

        <div class="modal-actions">

          <button
            type="submit"
            class="action-button start-button"
          >
            시작
          </button>

          <button
            type="button"
            class="action-button cancel-button"
            id="cancelButton"
          >
            취소
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- =========================
       공통 안내 창
  ========================== -->
  <div
    class="notice-overlay"
    id="noticeOverlay"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
  >
    <div class="notice-box">
      <p id="noticeMessage"></p>
      <button type="button" id="noticeConfirm">
        확인
      </button>
    </div>
  </div>


  <script>
    "use strict";

    /* =================================
       화면 요소
    ================================= */

    const mainScreen = document.getElementById("mainScreen");
    const gameScreen = document.getElementById("gameScreen");

    const amountModal = document.getElementById("amountModal");
    const amountForm = document.getElementById("amountForm");
    const amountInput = document.getElementById("amountInput");
    const validationMessage =
      document.getElementById("validationMessage");

    const gameMoney = document.getElementById("gameMoney");
    const gameRerollCount =
      document.getElementById("gameRerollCount");

    const noticeOverlay =
      document.getElementById("noticeOverlay");
    const noticeMessage =
      document.getElementById("noticeMessage");
    const noticeConfirm =
      document.getElementById("noticeConfirm");


    /* =================================
       게임 상태
    ================================= */

    // 게임을 시작할 때 입력한 금액으로 설정한다.
    let currentMoney = 0;

    // 새 게임을 시작하면 0개로 초기화한다.
    let rerollCount = 0;


    /* =================================
       공통 기능
    ================================= */

    function formatMoney(amount) {
      return amount.toLocaleString("ko-KR") + "원";
    }

    function showScreen(screen) {
      mainScreen.classList.remove("active");
      gameScreen.classList.remove("active");

      screen.classList.add("active");

      window.scrollTo({
        top: 0,
        behavior: "auto"
      });
    }

    function showNotice(message) {
      noticeMessage.textContent = message;

      noticeOverlay.classList.add("open");
      noticeOverlay.setAttribute("aria-hidden", "false");

      noticeConfirm.focus();
    }

    function closeNotice() {
      noticeOverlay.classList.remove("open");
      noticeOverlay.setAttribute("aria-hidden", "true");
    }


    /* =================================
       금액 입력 창
    ================================= */

    function openAmountModal() {
      amountInput.value = "";
      validationMessage.textContent = "";
      validationMessage.classList.remove("success");

      amountModal.classList.add("open");
      amountModal.setAttribute("aria-hidden", "false");

      // 키보드가 열리도록 잠시 뒤 입력창에 초점을 맞춘다.
      window.setTimeout(function () {
        amountInput.focus();
      }, 100);
    }

    function closeAmountModal() {
      amountModal.classList.remove("open");
      amountModal.setAttribute("aria-hidden", "true");
    }

    function validateAmount() {
      const rawValue = amountInput.value.trim();

      if (rawValue === "") {
        return {
          valid: false,
          message: "게임 금액을 입력해 주세요."
        };
      }

      const amount = Number(rawValue);

      if (!Number.isSafeInteger(amount)) {
        return {
          valid: false,
          message: "금액은 정수로 입력해 주세요."
        };
      }

      if (amount < 1000) {
        return {
          valid: false,
          message: "최소 금액은 1,000원입니다."
        };
      }

      if (amount > 5000) {
        return {
          valid: false,
          message: "최대 금액은 5,000원입니다."
        };
      }

      if (amount % 1000 !== 0) {
        return {
          valid: false,
          message: "1,000원 단위로 입력해 주세요."
        };
      }

      return {
        valid: true,
        amount: amount,
        message: "금액을 확인했습니다."
      };
    }

    amountInput.addEventListener("input", function () {
      validationMessage.textContent = "";
      validationMessage.classList.remove("success");
    });

    amountForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const result = validateAmount();

      if (!result.valid) {
        validationMessage.textContent = result.message;
        validationMessage.classList.remove("success");
        amountInput.focus();
        return;
      }

      startGame(result.amount);
    });


    /* =================================
       게임 시작 및 종료
    ================================= */

    function startGame(amount) {
      // 입력 금액을 새 게임의 초기 소지금으로 설정한다.
      currentMoney = amount;

      // 새 게임 시작 시 리롤 횟수를 초기화한다.
      rerollCount = 0;

      updateGameInfo();

      closeAmountModal();
      showScreen(gameScreen);
    }

    function updateGameInfo() {
      gameMoney.textContent = formatMoney(currentMoney);
      gameRerollCount.textContent =
        "리롤: " + rerollCount + "개";
    }


    /* =================================
       메인 화면 버튼
    ================================= */

    document
      .getElementById("openGameButton")
      .addEventListener("click", openAmountModal);

    document
      .getElementById("cancelButton")
      .addEventListener("click", function () {
        closeAmountModal();
        showScreen(mainScreen);
      });

    document
      .getElementById("shopButton")
      .addEventListener("click", function () {
        showNotice("상점 기능은 아직 정해지지 않았습니다.");
      });

    document
      .getElementById("settingsButton")
      .addEventListener("click", function () {
        showNotice("설정 기능은 아직 정해지지 않았습니다.");
      });

    document
      .getElementById("moneyButton")
      .addEventListener("click", function () {
        showNotice("돈 기능은 아직 정해지지 않았습니다.");
      });


    /* =================================
       게임 화면 버튼
       실제 기능은 추후 정의
    ================================= */

    document
      .getElementById("blueButton")
      .addEventListener("click", function () {
        showNotice("파란 버튼의 기능은 아직 정해지지 않았습니다.");
      });

    document
      .getElementById("redButton")
      .addEventListener("click", function () {
        showNotice("빨간 버튼의 기능은 아직 정해지지 않았습니다.");
      });

    document
      .getElementById("stopButton")
      .addEventListener("click", function () {
        showNotice("중지 버튼의 작동 방식은 아직 정해지지 않았습니다.");
      });


    /* =================================
       안내 창
    ================================= */

    noticeConfirm.addEventListener("click", closeNotice);

    noticeOverlay.addEventListener("click", function (event) {
      if (event.target === noticeOverlay) {
        closeNotice();
      }
    });

    // 금액 입력 창의 바깥을 눌러도 임의로 닫히지 않도록 한다.
    // 취소 버튼을 통해 메인 화면으로 돌아간다.

  </script>

</body>
</html>
