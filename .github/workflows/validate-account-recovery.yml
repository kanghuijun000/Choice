name: Validate Risk Game recovery code

on:
  pull_request:
    branches: [main]
  push:
    branches: [account-recovery]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check script.js
          node --check friends.js
          node --check recovery.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Function
        run: deno check supabase/functions/risk-game-recovery/index.ts
